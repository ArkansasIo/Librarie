services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: librarie
      MYSQL_USER: librarie
      MYSQL_PASSWORD: librarie
    ports: ["3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
  api:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      PORT: 3000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: librarie
      MYSQL_PASSWORD: librarie
      MYSQL_DATABASE: librarie
    ports: ["3000:3000"]
    volumes:
      - ./typescript-api:/app
    depends_on:
      - mysql
volumes:
  mysql_data:
