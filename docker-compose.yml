services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: librarie
      MYSQL_USER: librarie
      MYSQL_PASSWORD: librarie
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/migrations:/docker-entrypoint-initdb.d/01-migrations:ro
      - ./mysql/seeds:/docker-entrypoint-initdb.d/02-seeds:ro
volumes:
  mysql_data:
