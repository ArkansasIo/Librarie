name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript-api/package-lock.json
      - run: npm install
      - run: npm run build
